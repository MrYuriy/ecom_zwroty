<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raport dzienny — Zwroty e-com</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
    <style>
      /* The tab holds the PDF alone: reloading it asks the server for a freshly built report. */
      body {
        margin: 0;
      }

      #pdf {
        display: block;
        width: 100%;
        height: calc(100vh - 44px);
        border: 0;
      }

      /* Phones often refuse to show a PDF inside a page, so the file stays one tap away. */
      #bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 44px;
        padding: 0 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
      }

      #pdf[hidden],
      #bar[hidden],
      #message[hidden] {
        display: none;
      }

      #message {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="bar" hidden>
      <span id="bar-day"></span>
      <a id="download" class="btn secondary small" download>Pobierz PDF</a>
    </div>
    <p id="message">Przygotowywanie raportu…</p>
    <iframe id="pdf" title="Raport dzienny" hidden></iframe>
    <script src="api.js?v=dev"></script>
    <script src="report-view.js?v=dev"></script>
  </body>
</html>

<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raport dzienny — Zwroty e-com</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main>
      <div class="page-head">
        <h1>Raport dzienny (PDF)</h1>
      </div>

      <section class="card form-card">
        <p class="muted">
          Formularz „ZWROTY OD KLIENTÓW” (PL-FORM-CL-LM-038) ze zwrotami przyjętymi w wybranym dniu —
          wszystkie zwroty z tą datą zwrotu, otwarte i zamknięte. Otwiera się w nowej karcie, gotowy do druku.
        </p>
        <form id="report-form" class="scan-row">
          <label>
            Data zwrotu
            <input name="day" type="date" required />
          </label>
          <button type="submit" id="submit">Otwórz PDF</button>
        </form>
      </section>
    </main>
    <script src="api.js?v=dev"></script>
    <script src="report.js?v=dev"></script>
  </body>
</html>

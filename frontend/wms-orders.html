<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zamówienia WMS — Zwroty e-com</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main>
      <div class="page-head">
        <div>
          <h1>Zamówienia WMS</h1>
          <p class="muted">Numery BO/WMS i Tempo z arkusza Google, aktualizowane co godzinę.</p>
        </div>
        <button id="sync" type="button" class="secondary">Synchronizuj teraz</button>
      </div>

      <section class="card">
        <form id="search" class="scan-row">
          <input name="q" type="search" placeholder="Szukaj po numerze BO/WMS lub Tempo" aria-label="Szukaj zamówienia" />
          <button type="submit">Szukaj</button>
        </form>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table class="responsive">
            <thead>
              <tr>
                <th>Numer BO/WMS</th>
                <th>Numer Tempo</th>
                <th>Dodano</th>
              </tr>
            </thead>
            <tbody id="orders"></tbody>
          </table>
        </div>
        <div id="pager" class="pager"></div>
      </section>
    </main>
    <script src="api.js?v=dev"></script>
    <script src="wms-orders.js?v=dev"></script>
  </body>
</html>

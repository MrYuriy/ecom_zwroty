<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pozycja — Zwroty e-com</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main>
      <a id="back" class="back" href="returns.html">‹ Wróć do zwrotu</a>
      <div class="page-head">
        <div>
          <h1 id="title">Pozycja</h1>
          <p id="order-ref" class="muted"></p>
        </div>
        <div class="actions">
          <a id="edit-line" class="btn secondary" href="#">Edytuj pozycję</a>
        </div>
      </div>

      <section class="card">
        <dl class="summary">
          <div><dt>Referencja</dt><dd id="v-reference">—</dd></div>
          <div><dt>Produkt</dt><dd id="v-product">—</dd></div>
          <div><dt>EAN</dt><dd id="v-ean">—</dd></div>
          <div><dt>Sparametryzowany</dt><dd id="v-param">—</dd></div>
          <div><dt>Ilość</dt><dd id="v-quantity">—</dd></div>
          <div><dt>Nośnik</dt><dd id="v-carrier">—</dd></div>
          <div><dt>Klasyfikacja</dt><dd id="v-condition">—</dd></div>
          <div><dt>Opis uszkodzenia</dt><dd id="v-damage">—</dd></div>
          <div><dt>Uwagi</dt><dd id="v-remarks">—</dd></div>
          <div><dt>W arkuszu raportu</dt><dd id="v-exported">—</dd></div>
        </dl>
      </section>

      <section class="card" aria-labelledby="photos-title">
        <div class="page-head">
          <h2 id="photos-title">Zdjęcia</h2>
          <div id="photo-links" class="actions hidden">
            <a id="open-original" target="_blank" rel="noopener" href="#">Otwórz w pełnej rozdzielczości</a>
            <a id="download" href="#" download>Pobierz</a>
          </div>
        </div>
        <p id="no-photos" class="empty hidden">Brak zdjęć dla tej pozycji.</p>
        <div id="viewer" class="viewer hidden">
          <img id="viewer-img" alt="Zdjęcie pozycji" />
          <span id="viewer-counter" class="viewer-counter"></span>
        </div>
        <p id="viewer-name" class="muted viewer-name"></p>
        <div id="viewer-strip" class="thumbs viewer-strip"></div>
      </section>
    </main>
    <script src="api.js?v=dev"></script>
    <script src="line-view.js?v=dev"></script>
  </body>
</html>

<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produkty — Zwroty e-com</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <header id="topbar" class="topbar"></header>
    <main>
      <div class="page-head">
        <h1>Produkty (SKU)</h1>
        <a class="btn" href="sku-form.html">+ Nowy produkt</a>
      </div>

      <section class="card">
        <form id="search" class="scan-row">
          <input name="q" type="search" placeholder="Szukaj po referencji, EAN lub nazwie" aria-label="Szukaj produktu" />
          <button type="submit">Szukaj</button>
        </form>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table class="responsive">
            <thead>
              <tr>
                <th>Referencja</th>
                <th>EAN</th>
                <th>Nazwa</th>
                <th>Sparametryzowany</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="skus"></tbody>
          </table>
        </div>
        <div id="pager" class="pager"></div>
      </section>
    </main>
    <script src="api.js?v=dev"></script>
    <script src="skus.js?v=dev"></script>
  </body>
</html>

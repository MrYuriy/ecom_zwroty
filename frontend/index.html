<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logowanie — Zwroty e-com</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="card login-card">
        <h1>Zwroty e-com</h1>
        <p class="muted">Zaloguj się, aby rejestrować zwroty.</p>
        <div id="login-error" class="notice error" role="alert" hidden></div>
        <form id="login-form" novalidate>
          <label>
            Login WMS
            <input type="text" name="wms_login" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
          </label>
          <label>
            Hasło
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Zaloguj</button>
        </form>
      </div>
    </div>
    <script src="api.js?v=dev"></script>
    <script src="login.js?v=dev"></script>
  </body>
</html>

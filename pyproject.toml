[project]
name = "ecom-zwroty"
version = "0.1.0"
description = "CRM for registering returned e-commerce orders."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "google-auth>=2.30.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
lint.select = ["B", "C", "E", "F", "W", "I"]
lint.ignore = ["E501", "B008", "B904"]
exclude = [".git", "__pycache__", ".venv", "venv", "versions/", "__init__.py"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F405"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

---
services:
  app:
    build:
      context: .
    image: ecom-zwroty-app
    container_name: ecom-zwroty-api
    env_file: [.env]
    environment:
      # .env's DATABASE_URL is for running on the host; inside compose the DB is the "db" service.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PORT: "8000"
      UPLOADS_DIR: /data/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # A host folder, so photos survive image rebuilds and are easy to back up.
      - ./uploads:/data/uploads
      # The Google key is mounted, never copied into the image (see .dockerignore).
      - ./creds.json:/app/creds.json:ro
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: ecom-zwroty-db
    env_file: [.env]
    # Localhost only: lets `uv run uvicorn` on the host reach the DB without exposing it to the network.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
